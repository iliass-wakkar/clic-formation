    <script src="../xtras/jquery-3.1.1.js"></script>
    <script src="tinymce4-5-2/tinymce.min.js"></script>
    <script>
    var score = 0 ;
    $( document ).ready(function() {
      tinymce.init({
        selector: 'textarea',
        height: 10,
        menubar: false,
        plugins: [
          'advlist autolink lists link image charmap print preview anchor textcolor',
          'searchreplace visualblocks code fullscreen',
          'insertdatetime media table contextmenu paste code'
        ],
        // toolbar: 'undo redo | insert | styleselect | bold italic | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link image',
         toolbar: 'undo redo | bold italic forecolor backcolor  ',
      });
    });

    </script>

    <div class="exercice">
      <p>
        <ol>
          <li>Saisir "Bienvenue dans le monde merveilleux du clavier"</li>
          <li>Mettre le mot "Bienvenue" en gras</li>
          <li>Mettre le mot "monde" en italique</li>
          <li>Saisir "CLIC-FORMATION" à l'aide du verrouillage majuscule.</li>
          <li>Mettre la phrase "FORMATION GRATUITE SUR LE WEB" en orange sur fond noir.</li>
        </ol>
        <textarea>
        </textarea>
      </p>
