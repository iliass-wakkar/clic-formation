<head>
	<title>Floating image gallery with drag &amp; drop</title>
	<style type="text/css">
	body{
		

		height:300px;
		width:900px;
		margin:5px;
		padding-left:0px;
	}

	form{
		display:inline;
	}
	.imageBox,.imageBoxHighlighted{
		width:130px;	/* Total width of each image box */
		height:160px;	/* Total height of each image box */
		float:left;
	}
	.imageBox_theImage{
		width:110px;	/* Width of image */
		height:125px;	/* Height of image */

		/*
		Don't change these values *
		*/
		background-position: center center;
		background-repeat: no-repeat;
		margin: 0 auto;
		margin-bottom:2px;
	}

	.imageBox .imageBox_theImage{
		border:1px solid #DDD;	/* Border color for not selected images */
		padding:2px;
	}
	.imageBoxHighlighted .imageBox_theImage{
		border:3px solid #316AC5;	/* Border color for selected image */
		padding:0px;

	}
	.imageBoxHighlighted span{	/* Title of selected image */
		background-color: #316AC5;
		color:#FFFFFF;
		padding:2px;
	}

	.imageBox_label{	/* Title of images - both selected and not selected */
		text-align:center;
		font-family: arial;
		font-size:11px;
		padding-top:2px;
		margin: 0 auto;
	}

	/*
	DIV that indicates where the dragged image will be placed
	*/
	#insertionMarker{
		height:150px;
		width:6px;
		position:absolute;
		display:none;

	}

	#insertionMarkerLine{
		width:6px;	/* No need to change this value */
		height:145px;	/* To adjust the height of the div that indicates where the dragged image will be dropped */

	}

	#insertionMarker img{
		float:left;
	}

	/*
	DIV that shows the image as you drag it
	*/
	#dragDropContent{

		opacity:0.4;	/* 40 % opacity */
		filter:alpha(opacity=40);	/* 40 % opacity */

		/*
		No need to change these three values
		*/
		position:absolute;
		z-index:10;
		display:none;

	}


	</style>
	<script type="text/javascript" src="js/floating-gallery.js" ></script>
</head>
<body>


<div id="GalleryContainer">
	<div class="imageBox" id="imageBox0">
		<div class="imageBox_theImage" style="background-image:url('example_images/o.jpg')"></div>
			</div>
		<div class="imageBox" id="imageBox2">
		<div class="imageBox_theImage" style="background-image:url('example_images/y.jpg')"></div>
		
	</div>
		<div class="imageBox" id="imageBox3">
		<div class="imageBox_theImage" style="background-image:url('example_images/u.jpg')"></div>
		
	</div>
		<div class="imageBox" id="imageBox4">
		<div class="imageBox_theImage" style="background-image:url('example_images/e.jpg')"></div>
		
	</div>
		<div class="imageBox" id="imageBox5">
		<div class="imageBox_theImage" style="background-image:url('example_images/i.jpg')"></div>
		
	</div>
		<div class="imageBox" id="imageBox6">
		<div class="imageBox_theImage" style="background-image:url('example_images/a.jpg')"></div>
		
	</div>
			</div>
</div>
<div id="insertionMarker">
	<img src="images/marker_top.gif">
	<img src="images/marker_middle.gif" id="insertionMarkerLine">
	<img src="images/marker_bottom.gif">
</div>
<div id="dragDropContent">
</div>
<div id="debug" style="clear:both">
</div>
</body>
