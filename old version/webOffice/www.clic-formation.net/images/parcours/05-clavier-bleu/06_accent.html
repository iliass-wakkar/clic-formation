<body bgcolor="#EDE6DA" onLoad="init()">
<script language="JavaScript"><!--

// Ce programme ecrit par stephane cordier en decembre 1998
// le formulaire contient les champs time,numero,entree,sortie
// il contient les functions : init, test,compteur et affiche

function init()
{
debut = new Date()
mots = new  Array ("école", "édition", "noël", "éléphant", "être", "coût", "haïr", "piège", "capharnaüm", "infâme", "huître", "fièvre", "rêve", "célèbre", "exprès" )
nb_mots = mots.length;
duree = 60;
actuel = 0;
affiche()
}

function test()
{ 
//  actuel = document.c.numero.value
  aux = document.c.entree.value
  document.c.entree.value="";
  if (aux == mots[actuel] ) 
  {
  actuel++
  if (actuel==nb_mots) {
// lorsqu'on gagne on va cherche l'image gagneX.JPG ou X est tire au sort entre 0 et 6
// c'est cette ligne qu'il faut modifier pour modifier les images donnees au gagnant
// les images sont dans le meme dossier
// on peut mettre une seule image img8src = lenomdufichier 

  img_src = "gagne"+ Math.floor(Math.random() * 7) +".JPG";
  img_src = "bravo4.html"
  top.location.href = img_src;
  }
  else {
    window.status="Bien, au suivant. Ne perds pas de temps "
    affiche ()
    }
  }
  else  
  {  
   window.status="Non, il y a une erreur, recommencez!"
   compteur();
  }
}

function compteur()
{ 
 temps = new Date()
 seconds = duree + Math.floor((debut - temps ) / 1000)
 setTimeout("compteur()", 905)
 document.c.time.value= seconds
 if (seconds <0) {alert("Perdu "); init();}
}

function affiche ()
{ document.c.numero.value = actuel;
  document.c.sortie.value = mots[actuel];
  document.c.entree.value = "";
  document.c.entree.focus();
  compteur()
}
// --></script>
